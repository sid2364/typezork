# Builds the site and publishes it to https://sid2364.github.io/zork/ by
# pushing dist/ into the zork/ folder of the sid2364/sid2364.github.io repo.
#
# One-time setup:
#   1. ssh-keygen -t ed25519 -f zork_deploy -N ""
#   2. In sid2364/sid2364.github.io → Settings → Deploy keys: add zork_deploy.pub
#      with write access.
#   3. In this repo → Settings → Secrets → Actions: add the private key as
#      ZORK_DEPLOY_KEY.
#   4. Check PAGES_BRANCH below matches the branch your user site publishes from.
# Until the secret exists, the publish step is skipped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PAGES_REPO: sid2364/sid2364.github.io
  PAGES_BRANCH: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ZORK_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish to ${{ env.PAGES_REPO }}/zork
        if: env.HAS_KEY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ZORK_DEPLOY_KEY }}
          external_repository: ${{ env.PAGES_REPO }}
          publish_branch: ${{ env.PAGES_BRANCH }}
          publish_dir: ./dist
          destination_dir: zork
          # Never touch the rest of the user site.
          keep_files: true
          commit_message: 'Deploy typezork ${{ github.sha }}'
      - name: Skipped publishing
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ZORK_DEPLOY_KEY is not set; built but not published."
